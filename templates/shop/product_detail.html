{% extends "shop/base.html" %}
{% block content %}
<p><a href="{% url 'category' product.category.slug %}">&larr; {{ product.category.name }}</a></p>
{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width:400px;border-radius:10px">{% endif %}
<h1>{{ product.name }}</h1>
<p>{{ product.short_description }}</p>
<p class="price" style="font-size:26px">${{ product.price }}</p>
{% endblock %}
