<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Magazin{% endblock %}</title>
  <style>
    body{margin:0;font-family:sans-serif;background:#f5f6f8}
    header{background:#1f2937;padding:14px 24px}
    header a{color:#fff;text-decoration:none;font-weight:700;font-size:20px}
    main{max-width:1000px;margin:24px auto;padding:0 16px}
    .cats a{display:inline-block;margin:0 6px 16px 0;padding:8px 16px;background:#fff;border-radius:20px;text-decoration:none;color:#333}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
    .card{background:#fff;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit}
    .card img{width:100%;height:170px;object-fit:cover}
    .noimg{height:170px;background:#e5e7eb}
    .card div.body{padding:12px}
    .price{color:#16a34a;font-weight:700}
  </style>
</head>
<body>
  <header><a href="{% url 'home' %}">Magazin</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
